name: Stage verified Ensō stability snapshot
on:
  push:
    branches: [release/enso-stability-20260928]
    paths: [.github/workflows/enso-stability-stage.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 53b61f1ccb1cce6f6fb7d78a3997408387d47de4
          path: site
      - uses: actions/checkout@v4
        with:
          ref: 6e56b50ed38cc8cd6c50feec31c93e5724ea8721
          path: definition
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce exact reviewed bytes with unchanged copy and media
        run: |
          mkdir baseline
          git -C site archive HEAD | tar -x -C baseline
          python3 - <<'PY'
          from pathlib import Path
          text=Path('definition/.github/workflows/enso-stability-stage.yml').read_text()
          part=text.split('      - name: Reproduce reviewed snapshot and verify exact manifest\n        run: |\n',1)[1].split('      - name:',1)[0]
          Path('/tmp/reproduce.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in part.splitlines())+'\n')
          PY
          bash -e /tmp/reproduce.sh
      - name: Compare modal behavior and verify navigation on complete snapshots
        run: |
          cd tools
          npm init -y >/dev/null
          npm install --save-exact playwright-core@1.55.1 >/dev/null
          export CHROME_PATH="$(command -v google-chrome)"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory ../site > ../results/site-server.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory ../baseline > ../results/baseline-server.log 2>&1 &
          cat > check.mjs <<'JS'
          import {chromium} from 'playwright-core';
          import assert from 'node:assert/strict';
          import {writeFile} from 'node:fs/promises';
          const browser=await chromium.launch({executablePath:process.env.CHROME_PATH});
          const results=[];const baseline=new Map();
          try {
            for(const variant of ['baseline','candidate'])for(const width of [1440,390]){
              const context=await browser.newContext({viewport:{width,height:900}}),page=await context.newPage();page.setDefaultTimeout(8000);
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              const base='http://127.0.0.1:'+(variant==='baseline'?4174:4173);
              await page.goto(base+'/',{waitUntil:'domcontentloaded'});await page.waitForTimeout(1200);
              await page.locator('nav a[href="#enso"]').click();await page.waitForTimeout(1500);
              const videos=page.locator('#enso video');
              if(variant==='candidate')assert.equal(await videos.evaluateAll(vs=>vs.filter(v=>!v.paused).length),1);
              const buttons=await page.locator('#enso button').evaluateAll(bs=>bs.map(b=>({label:b.getAttribute('aria-label'),hasImage:!!b.querySelector('img'),hasVideo:!!b.querySelector('video')})));
              console.log('BUTTONS',variant,width,JSON.stringify(buttons));
              const imageButton=page.locator('#enso button[aria-label^="Explore "]').first();
              let modal=false;
              if(await imageButton.count()){
                await imageButton.focus();await page.keyboard.press('Enter');await page.waitForTimeout(700);
                modal=await page.getByRole('dialog').isVisible().catch(()=>false);
                console.log('MODALS',variant,width,await page.locator('dialog,[role="dialog"]').evaluateAll(ds=>ds.map(d=>({tag:d.tagName,open:d.open,role:d.getAttribute('role'),text:d.innerText.slice(0,150)}))));
                if(modal){await page.keyboard.press('Escape');await page.waitForTimeout(400);assert.equal(await page.getByRole('dialog').isVisible().catch(()=>false),false);}
              }
              if(variant==='baseline')baseline.set(width,modal);else assert.equal(modal,baseline.get(width),'Modal behavior regressed relative to production baseline');
              const video=videos.nth(1),button=video.locator('..');await video.scrollIntoViewIfNeeded();await page.waitForTimeout(400);
              if(await video.evaluate(v=>!v.paused)){await button.click();await page.waitForFunction(()=>document.querySelectorAll('#enso video')[1].paused);}
              await button.click();await page.waitForFunction(()=>{const v=document.querySelectorAll('#enso video')[1];return !v.paused&&v.currentTime>.1});
              if(variant==='candidate')assert.equal(await videos.evaluateAll(vs=>vs.filter(v=>!v.paused).length),1);
              await button.click();await page.waitForFunction(()=>document.querySelectorAll('#enso video')[1].paused);
              await page.evaluate(()=>window.scrollTo({top:0,behavior:'instant'}));await page.locator('nav a[href="#enso"]').focus();await page.keyboard.press('Enter');await page.waitForTimeout(500);
              assert.equal(new URL(page.url()).hash,'#enso');assert.equal(await page.locator('#merch-heading').evaluate(h=>getComputedStyle(h).clipPath),'none');
              assert.deepEqual(errors,[]);
              results.push({variant,width,pass:true,modal,imageButtons:buttons.filter(b=>b.label?.startsWith('Explore ')).length,buttons,pageErrors:errors});
              await page.screenshot({path:`../results/${variant}-${width}.png`});console.log('PASS',variant,width);await context.close();
            }
            for(const slug of ['grok-builders-night','grok-builders-night-sf','padelcon','backers-and-builders','zerion-supper-club-london']){
              const context=await browser.newContext(),page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));
              const response=await page.goto('http://127.0.0.1:4173/work/'+slug+'.html',{waitUntil:'domcontentloaded'});assert.equal(response.status(),200);await page.waitForTimeout(500);assert(await page.locator('h1').count());assert.deepEqual(errors,[]);results.push({slug,pass:true,pageErrors:errors});await context.close();
            }
            console.log('STAGED PASS',JSON.stringify(results));
          } finally {await writeFile('../results/staging-checks.json',JSON.stringify(results,null,2));await browser.close();}
          JS
          cp check.mjs ../results/
          node check.mjs
      - name: Save only verified assets to a clean release branch
        working-directory: site
        run: |
          test "$(git ls-remote origin refs/heads/gh-pages | cut -f1)" = 53b61f1ccb1cce6f6fb7d78a3997408387d47de4
          test -z "$(git ls-remote origin refs/heads/release/enso-verified-5ca2444a86)"
          git switch -c release/enso-verified-5ca2444a86
          python3 - <<'PY'
          import json,subprocess
          files=json.load(open('../results/deployment-manifest.json'))['changed']
          subprocess.run(['git','add','--',*files],check=True)
          actual=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert sorted(actual)==sorted(files)
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Stabilize font loading and coordinate Ensō preview playback; version changed assets'
          git push origin HEAD:refs/heads/release/enso-verified-5ca2444a86
          git rev-parse HEAD > ../results/release-commit.txt
          git diff --stat HEAD^ HEAD > ../results/release-stat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enso-verified-release
          path: results/
          retention-days: 3
