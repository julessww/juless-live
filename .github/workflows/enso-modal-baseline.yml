name: Ensō gallery baseline diagnosis
on:
  push:
    branches: [release/enso-stability-20260928]
    paths: [.github/workflows/enso-modal-baseline.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 53b61f1ccb1cce6f6fb7d78a3997408387d47de4
          path: site
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect baseline gallery interaction
        run: |
          mkdir tools results
          cd tools
          npm init -y >/dev/null
          npm install playwright-core@1.55.1 >/dev/null
          export CHROME_PATH="$(command -v google-chrome)"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory ../site > ../results/server.log 2>&1 &
          cat > check.mjs <<'JS'
          import {chromium} from 'playwright-core';
          import {writeFile} from 'node:fs/promises';
          const browser=await chromium.launch({executablePath:process.env.CHROME_PATH}),results=[];
          for(const width of [1440,390]){
            const context=await browser.newContext({viewport:{width,height:900}}),page=await context.newPage(),errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.setDefaultTimeout(5000);
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});await page.waitForTimeout(1200);
            await page.locator('nav a[href="#enso"]').click();await page.waitForTimeout(1500);
            await page.evaluate(()=>{window.__clicks=[];window.__keys=[];document.addEventListener('click',e=>window.__clicks.push({tag:e.target.tagName,label:e.target.closest('button')?.getAttribute('aria-label')}),true);document.addEventListener('keydown',e=>window.__keys.push({key:e.key,tag:e.target.tagName,label:e.target.getAttribute('aria-label')}),true)});
            const button=page.locator('#enso button').last();
            const before=await button.evaluate(el=>({tag:el.tagName,label:el.getAttribute('aria-label'),rect:el.getBoundingClientRect().toJSON(),html:el.outerHTML.slice(0,1200)}));
            await button.focus();const focused=await page.evaluate(()=>document.activeElement.outerHTML.slice(0,1200));
            await page.keyboard.press('Enter');await page.waitForTimeout(800);
            const after=await page.evaluate(()=>({clicks:window.__clicks,keys:window.__keys,active:document.activeElement?.outerHTML.slice(0,1200),dialogs:[...document.querySelectorAll('dialog')].map(d=>({open:d.open,rect:d.getBoundingClientRect().toJSON(),html:d.outerHTML.slice(0,1800)})),location:location.href,scrollY}));
            await page.screenshot({path:`../results/baseline-${width}.png`});
            results.push({width,before,focused,after,errors});console.log('BASELINE',JSON.stringify(results.at(-1)));
            await context.close();
          }
          await browser.close();await writeFile('../results/baseline.json',JSON.stringify(results,null,2));
          JS
          node check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enso-gallery-baseline
          path: results/
          retention-days: 3
