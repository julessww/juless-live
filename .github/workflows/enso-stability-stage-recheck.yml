name: Verify staged Ensō stability release
on:
  push:
    branches: [release/enso-stability-20260928]
    paths: [.github/workflows/enso-stability-stage-recheck.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned baseline and review recipes
        run: |
          git fetch --depth=1 origin 53b61f1ccb1cce6f6fb7d78a3997408387d47de4 7e901f8a0d4633dc05219a690530f32f91a548e7 e61fae0201f0f7ac330c99034aa64d91b608b0cf
          git cat-file -e 53b61f1ccb1cce6f6fb7d78a3997408387d47de4^{tree}
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          raw=subprocess.check_output(['git','show','e61fae0201f0f7ac330c99034aa64d91b608b0cf:.github/workflows/enso-stability-stage-recheck.yml']).decode().splitlines()
          names=['Extract fixed release recipe','Assert byte-equivalence to 20 passing browser scenarios','Compare existing image interaction with the baseline']
          for i,name in enumerate(names):
              start=raw.index('      - name: '+name)+2;out=[]
              for line in raw[start:]:
                  if line and not line.startswith('          '):break
                  out.append(line[10:] if line else '')
              assert out
              Path('/tmp/review-'+str(i)+'.sh').write_text('\n'.join(out)+'\n')
          PY
      - name: Extract fixed release recipe
        run: bash -e /tmp/review-0.sh
      - name: Prepare identical versioned release
        run: bash -e /tmp/enso-step-0.sh
      - name: Assert exact reviewed artifact
        run: bash -e /tmp/review-1.sh
      - name: Verify playback and case-study routes
        run: bash -e /tmp/enso-step-1.sh
      - name: Compare image-modal behavior with baseline
        run: bash -e /tmp/review-2.sh
      - name: Commit staged assets only
        run: bash -e /tmp/enso-step-2.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enso-staged-final
          path: /tmp/enso-release/results/
          retention-days: 3
