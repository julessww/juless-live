name: Verify exact Enso production release
on:
  push:
    branches: [verify/enso-exact-5ca2444a86]
    paths: [.github/workflows/enso-exact-stage.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tools
        run: |
          mkdir tools results
          cd tools
          npm init -y >/dev/null
          npm install --save-exact playwright@1.55.1 >/dev/null
          npx playwright install --with-deps webkit > ../results/browser-install.log 2>&1
      - name: Verify actual production bytes and interactions
        run: |
          export CHROME_PATH="$(command -v google-chrome)"
          cd tools
          cat > live.mjs <<'JS'
          import {chromium,webkit} from 'playwright';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {writeFile} from 'node:fs/promises';
          const base='https://jules.social/';
          const expected={
            '':'7dcce10bc7a9332f956e107c16bf9f48e336fa7e82113bc28376964fb303dd4c',
            'assets/PortfolioMotion-stable-5ca2444a86.js':'67fea1c2339d9895b4ac0d852eb69a11634d061fbb2f4cb4c2cd55473a8bffe7',
            'assets/index-stable-5ca2444a86.css':'e31c6328b485bfe9fced564dc7b607c9ddac70d8d4b95faff52e64509c9dccea'
          };
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const delivery=[];
          for(const [path,digest] of Object.entries(expected)) {
            const response=await fetch(base+path,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});
            assert.equal(response.status,200);
            const actual=sha(Buffer.from(await response.arrayBuffer()));assert.equal(actual,digest,path);
            delivery.push({path,status:response.status,sha256:actual});
          }
          console.log('LIVE BYTES VERIFIED',JSON.stringify(delivery));
          const results=[];
          for(const [engine,driver] of [['chrome',chromium],['webkit',webkit]]) {
            const browser=await driver.launch(engine==='chrome'?{executablePath:process.env.CHROME_PATH}:{});
            for(const width of [1440,390]) for(const slow of [false,true]) {
              const context=await browser.newContext({viewport:{width,height:900}});
              if(slow) await context.route(/\.woff2?(\?|$)/,async route=>{await new Promise(r=>setTimeout(r,2500));await route.continue().catch(()=>{});});
              await context.addInitScript(()=>{
                window.__ready=false;window.__headingReveals=0;
                const add=EventTarget.prototype.addEventListener;
                EventTarget.prototype.addEventListener=function(...args){if(this instanceof HTMLElement&&this.tagName==='MAIN'&&args[0]==='click')window.__ready=true;return add.apply(this,args)};
                const animate=Element.prototype.animate;
                Element.prototype.animate=function(...args){if(this.id==='merch-heading')window.__headingReveals++;return animate.apply(this,args)};
              });
              const page=await context.newPage();page.setDefaultTimeout(15000);const errors=[];page.on('pageerror',e=>errors.push(e.message));
              try {
                const modulePromise=page.waitForResponse(r=>r.url()===base+'assets/PortfolioMotion-stable-5ca2444a86.js');
                await page.goto(base,{waitUntil:'domcontentloaded'});await page.bringToFront();
                const module=await modulePromise;assert.equal(sha(await module.body()),expected['assets/PortfolioMotion-stable-5ca2444a86.js']);
                await page.waitForFunction(()=>window.__ready);
                await page.locator('nav a[href="#enso"]').click();
                const frames=await page.evaluate(()=>new Promise(resolve=>{
                  const start=performance.now(),samples=[];
                  function sample(){const h=document.getElementById('merch-heading');samples.push({t:performance.now()-start,y:scrollY,doc:document.documentElement.scrollHeight,top:h.getBoundingClientRect().top,clip:getComputedStyle(h).clipPath,playing:[...document.querySelectorAll('#enso video')].filter(v=>!v.paused).length});if(performance.now()-start<3300)setTimeout(sample,50);else resolve(samples)}sample();
                }));
                const measured=frames.filter(f=>f.t>150),last=frames.at(-1);
                assert(measured.length>10);assert(measured.every(f=>f.playing<=1));assert(last.top>0&&last.top<900);assert.equal(last.clip,'none');
                assert.equal(await page.evaluate(()=>window.__headingReveals),0);
                const heightRange=Math.max(...measured.map(f=>f.doc))-Math.min(...measured.map(f=>f.doc));
                const scrollRange=Math.max(...measured.map(f=>f.y))-Math.min(...measured.map(f=>f.y));
                if(slow){assert(heightRange<=1,'Late document-height shift');assert(scrollRange<=1,'Late scroll jump');}
                await page.evaluate(()=>window.scrollTo({top:0,behavior:'instant'}));
                await page.locator('nav a[href="#enso"]').focus();await page.keyboard.press('Enter');await page.waitForTimeout(500);
                assert.equal(new URL(page.url()).hash,'#enso');assert.equal(await page.evaluate(()=>window.__headingReveals),0);
                if(!slow) {
                  const second=page.locator('#enso video').nth(1),button=second.locator('..');
                  await second.scrollIntoViewIfNeeded();await page.waitForTimeout(400);
                  if(await second.evaluate(v=>!v.paused)){await button.click();await page.waitForFunction(()=>document.querySelectorAll('#enso video')[1].paused);}
                  await button.click();await page.waitForFunction(()=>{const v=document.querySelectorAll('#enso video')[1];return !v.paused&&v.currentTime>0.1});
                  assert.equal(await page.locator('#enso video').evaluateAll(vs=>vs.filter(v=>!v.paused).length),1);
                  await button.click();await page.waitForFunction(()=>document.querySelectorAll('#enso video')[1].paused);
                  await page.screenshot({path:`../results/live-${engine}-${width}.png`});
                }
                assert.deepEqual(errors,[]);results.push({engine,width,slowFonts:slow,pass:true,heightRange,scrollRange,last});
              } catch(error) { results.push({engine,width,slowFonts:slow,pass:false,error:error.message,errors}); }
              console.log('LIVE RESULT',JSON.stringify(results.at(-1)));await context.close();
            }
            await browser.close();
          }
          await writeFile('../results/live-results.json',JSON.stringify({version:'5ca2444a86',delivery,results},null,2));
          if(results.some(r=>!r.pass))process.exitCode=1;
          JS
          cp live.mjs ../results/live.mjs
          node live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enso-exact-live-5ca2444a86
          path: results/
          retention-days: 3
